# HireGameDev Multi-Domain Nginx Configuration (ADR-012 / M0.7)
# Serves:
#   - hiregamedev.com         (Brand landing, /Legal/*, /Admin)
#   - www.hiregamedev.com     (301 -> https://hiregamedev.com)
#   - jobs.hiregamedev.com    (Candidate portal, public job board, /studios/{slug})
#   - studio.hiregamedev.com  (Studio hiring & verification portal)

upstream hiregamedev_kestrel {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. Drop unrecognized Host headers (defense-in-depth alongside Kestrel AllowedHosts)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 2. HTTP -> HTTPS redirect + Let's Encrypt HTTP-01 ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name hiregamedev.com www.hiregamedev.com jobs.hiregamedev.com studio.hiregamedev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Canonical www -> apex redirect over HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hiregamedev.com;

    ssl_certificate     /etc/letsencrypt/live/hiregamedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiregamedev.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://hiregamedev.com$request_uri;
}

# 4. Primary multi-portal HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hiregamedev.com jobs.hiregamedev.com studio.hiregamedev.com;

    ssl_certificate     /etc/letsencrypt/live/hiregamedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiregamedev.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:HGD_TLS:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Long-lived cache for self-hosted WOFF2 fonts
    location /fonts/ {
        proxy_pass         http://hiregamedev_kestrel;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires            365d;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass         http://hiregamedev_kestrel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
